name: publish-testpypi

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package set to publish
        required: true
        default: core
        type: choice
        options:
          - core
          - bing_ads
          - meta
          - google_ads_data_manager
          - klaviyo
          - tiktok_ads
          - all_destinations
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build package
        run: |
          mkdir -p dist

          case "${{ inputs.package }}" in
            core)
              uv build --sdist --wheel --out-dir dist
              ;;
            bing_ads)
              uv build --sdist --wheel --out-dir dist destination_connectors/bing_ads
              ;;
            meta)
              uv build --sdist --wheel --out-dir dist destination_connectors/meta
              ;;
            google_ads_data_manager)
              uv build --sdist --wheel --out-dir dist destination_connectors/google_ads_data_manager
              ;;
            klaviyo)
              uv build --sdist --wheel --out-dir dist destination_connectors/klaviyo
              ;;
            tiktok_ads)
              uv build --sdist --wheel --out-dir dist destination_connectors/tiktok_ads
              ;;
            all_destinations)
              uv build --sdist --wheel --out-dir dist destination_connectors/bing_ads
              uv build --sdist --wheel --out-dir dist destination_connectors/meta
              uv build --sdist --wheel --out-dir dist destination_connectors/google_ads_data_manager
              uv build --sdist --wheel --out-dir dist destination_connectors/klaviyo
              uv build --sdist --wheel --out-dir dist destination_connectors/tiktok_ads
              ;;
            all)
              uv build --sdist --wheel --out-dir dist
              uv build --sdist --wheel --out-dir dist destination_connectors/bing_ads
              uv build --sdist --wheel --out-dir dist destination_connectors/meta
              uv build --sdist --wheel --out-dir dist destination_connectors/google_ads_data_manager
              uv build --sdist --wheel --out-dir dist destination_connectors/klaviyo
              uv build --sdist --wheel --out-dir dist destination_connectors/tiktok_ads
              ;;
            *)
              printf 'Unknown package input: %s\n' "${{ inputs.package }}"
              exit 2
              ;;
          esac

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
